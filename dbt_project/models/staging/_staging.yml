version: 2

sources: []

models:
  - name: stg_technicians
    description: >
      One row per technician_id, deduped to the most-recently-updated
      payroll record.
    columns:
      - name: technician_id
        data_tests:
          - unique
          - not_null
      - name: hourly_rate
        data_tests:
          - not_null

  - name: stg_jobs
    description: Cleaned dispatch/work-order feed, one row per job.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'no_show']
      - name: priority
        data_tests:
          - accepted_values:
              values: ['Standard', 'Rush', 'Emergency']

  - name: stg_route_stops
    description: >
      Multi-leg route stops. prev_stop_id chains stops within a route_id;
      NULL prev_stop_id marks the first stop (depot departure).
    columns:
      - name: stop_id
        data_tests:
          - unique
          - not_null
      - name: route_id
        data_tests:
          - not_null

  - name: stg_timesheets
    description: Deduped technician time entries.
    columns:
      - name: timesheet_id
        data_tests:
          - unique
          - not_null
      - name: hours_worked
        data_tests:
          - not_null

  - name: stg_parts_billing
    description: Per-job billing lines (parts, labor surcharges, credit returns).
    columns:
      - name: billing_id
        data_tests:
          - unique
          - not_null
      - name: job_id
        data_tests:
          - not_null

  - name: stg_sla_targets
    description: SLA policy lookup by job priority tier.
    columns:
      - name: priority
        data_tests:
          - unique
          - not_null
